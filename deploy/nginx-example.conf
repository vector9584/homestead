# 站点 nginx 配置示例
#
# 用法：把 <...> 占位符换成你自己的值，放到 sites-available/ 再 link 到 sites-enabled/。
# 前提：这份配置所属的 nginx 必须编译了 --with-http_dav_module（暂存区上传要用）。
#      用 `nginx -V 2>&1 | tr ' ' '\n' | grep dav` 确认。
#
# 校验：nginx -t && nginx -s reload
# 别用 systemctl restart —— 如果有两套 nginx 共用 pid 文件，会卡住或误杀别人。

server {
    listen       <PORT> default_server;
    server_name  your-domain.example.com;

    root   /srv/site;
    index  index.html;

    charset utf-8;
    client_max_body_size 2g;

    # ── 鉴权：server 级子请求，先于 try_files 执行 ────────────────────
    # 注意 auth.php 里必须先 realpath 判断存在性，不存在直接 204 放行，
    # 否则所有 404 都会变成 401（详见 docs/routing-contract.md）。
    auth_request /_auth;

    location = /_auth {
        internal;
        include        fastcgi_params;
        fastcgi_param  SCRIPT_FILENAME /srv/site/.acl/auth.php;
        fastcgi_pass   unix:/run/php/php-fpm.sock;
    }

    # ── 静态资源：公开 ────────────────────────────────────────────────
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # ── 首页 ──────────────────────────────────────────────────────────
    location = / {
        try_files /index.html =404;
    }

    # ── 受保护目录（按实际目录名改）──────────────────────────────────
    location ~ ^/(notes|photos|lab)/ {
        try_files $uri $uri/ @notfound;
    }

    # ── 后台 ──────────────────────────────────────────────────────────
    location /admin/ {
        index  index.html;
        try_files $uri $uri/ @notfound;
    }

    # ── 暂存区：WebDAV 写入，不经过 auth_request ──────────────────────
    location /drop/ {
        dav_methods         PUT DELETE;
        create_full_put_path on;
        dav_access          user:rw group:r all:r;
        client_max_body_size 4g;
    }

    # ── 其余 ──────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ @notfound;
    }

    # 命名 location 才会触发 error_page（`try_files =404` 不会）
    location @notfound {
        return 404;
    }

    # ── 自定义状态页 ──────────────────────────────────────────────────
    error_page 401 /401.html;
    error_page 404 /404.html;

    location = /401.html { internal; }
    location = /404.html { internal; }

    # ── 安全兜底 ──────────────────────────────────────────────────────
    location ~ /\.acl/ {
        deny all;
        return 404;
    }

    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }
}
